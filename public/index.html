<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120e20" />

    <!-- Icônes : le piment, partout. logo192/512 sont les logos de Create
         React App, gardés uniquement parce que content.js s'en sert comme
         icône de la techno React — ils ne représentent pas le site. -->
    <!-- Le thème est posé sur <html> avant le premier rendu. Sans ça, la
         page s'afficherait en clair pendant un instant, le temps que React
         démarre. Le site est de nuit par défaut : seul un choix explicite
         de mode clair, retenu d'une visite à l'autre, le ramène au jour. -->
    <script>
      (function () {
        var light = false;
        try {
          light = localStorage.getItem("portfolio:theme") === "light";
        } catch (e) {
          /* stockage bloqué : on ouvre de nuit */
        }
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (light) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#fbf7ff");
        }
      })();
    </script>

    <link rel="icon" href="%PUBLIC_URL%/logo.ico" />
    <link rel="icon" type="image/png" sizes="any" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Cyrine Zarkouna — Data Analyst</title>
    <meta
      name="description"
      content="Cyrine Zarkouna, data analyst. Projets data, analyses exploratoires et développement web."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Outfit:wght@300..800&family=Space+Grotesk:wght@400;500;700&display=swap"
    />

    <!-- Partage de lien. og:image doit être une URL absolue : les robots des
         réseaux sociaux ne résolvent pas les chemins relatifs. Sans cette
         balise, ils tombaient sur l'icône par défaut de React. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cyrine Zarkouna" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://cyrinezrk.github.io/portfolio/" />
    <meta property="og:title" content="Cyrine Zarkouna — Data Analyst" />
    <meta
      property="og:description"
      content="Du développement web vers la data. Projets, analyses et parcours."
    />
    <meta property="og:image" content="https://cyrinezrk.github.io/portfolio/logo.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="Le logo de Cyrine Zarkouna : un piment rouge." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cyrine Zarkouna — Data Analyst" />
    <meta
      name="twitter:description"
      content="Du développement web vers la data. Projets, analyses et parcours."
    />
    <meta name="twitter:image" content="https://cyrinezrk.github.io/portfolio/logo.png" />
    <meta name="twitter:image:alt" content="Le logo de Cyrine Zarkouna : un piment rouge." />
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour afficher ce site.</noscript>
    <div id="root"></div>
  </body>
</html>
